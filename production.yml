version: '3'

volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
#  production_traefik: {}


# Container logs stay on the host's (encrypted) disk, bounded and rotated: five files of 20 MB each
# per service, roughly a month of a quiet server. Older lines are gone with the oldest file.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: attendees_production_django
    container_name: django
    depends_on:
      - postgres
      - redis
    user: "1001"
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
      - ./.envs/.production/.mailgun.env
    ports:
      # Only Traefik on 443 faces the network; gunicorn is reached through it and is published to
      # the host loopback alone (Docker publishes past ufw unless told otherwise).
      - "127.0.0.1:8008:5000"
    logging: *logging
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: attendees_production_postgres
    container_name: postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/data:Z
      - production_postgres_data_backups:/backups:z
    env_file:
      - ./.envs/.production/.postgres

#  traefik:
#    build:
#      context: .
#      dockerfile: ./compose/production/traefik/Dockerfile
#    image: attendees_production_traefik
#    depends_on:
#      - django
#    volumes:
#      - production_traefik:/etc/traefik/acme:z
#    ports:
#      - "0.0.0.0:80:80"
#      - "0.0.0.0:443:443"
#      - "0.0.0.0:5555:5555"

  redis:
    image: redis:6
    container_name: redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"

  celeryworker:
    <<: *django
    image: attendees_production_celeryworker
    container_name: celeryworker
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: attendees_production_celerybeat
    container_name: celerybeat
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: attendees_production_flower
    container_name: flower
    ports:
      - "127.0.0.1:5555:5555"
    logging: *logging
    command: /start-flower

