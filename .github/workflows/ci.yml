  # With no caching at all the entire ci process takes 4m 30s to complete!
  pytest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: show docker compose version
        run: docker compose -v

      - name: create an empty sendgrid.env to continue
        run: touch .envs/.local/.sendgrid.env .envs/.local/.mailgun.env

      - name: Build the Stack
        run:  timeout 1800 docker compose -f local.yml build

      - name: Run DB Migrations
        run:  timeout 300 docker compose -f local.yml run --rm django python manage.py migrate

      - name: Run Django Tests
        run:  timeout 500 docker compose -f local.yml run django pytest

      - name: Tear down the Stack
        run:  docker compose -f local.yml down

  # The same suite on SQLite, without Docker. The application runs on either backend from the
  # database setting alone; this job is what keeps that true.
  pytest-sqlite:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: sqlite:////tmp/attendees-ci.sqlite3
      CELERY_BROKER_URL: memory://
      USE_DOCKER: "no"

    steps:

      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install system libraries (psycopg2 builds against libpq; WeasyPrint needs Pango)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev gdal-bin libpango-1.0-0 libpangoft2-1.0-0

      - name: Install Python requirements
        run: pip install -r requirements/local.txt

      - name: Build a database from the migrations
        run: python manage.py migrate

      - name: The models and the migrations agree
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django Tests on SQLite
        run: timeout 900 pytest
