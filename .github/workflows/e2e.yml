name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install Node dependencies
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Build and Start Django Docker Environment
      run: |
        touch .envs/.local/.sendgrid.env .envs/.local/.mailgun.env
        docker compose -f local.yml build
        docker compose -f local.yml run --rm django python manage.py migrate
        docker compose -f local.yml up -d
        # Wait for PostgreSQL and Django to be fully ready
        sleep 15
        docker compose -f local.yml run --rm django python manage.py update_content_types
        # Load your natural key fixture
        docker compose -f local.yml run --rm django python manage.py loaddata fixtures/ci_seed.json

    # The specs sign in as `jack` from ci_seed.json. Set his password here
    # rather than relying on the C_PASSWORD secret alone: GitHub does not give
    # secrets to pull requests from forks, so without this every spec that
    # signs in fails on any outside contribution. The secret is still used
    # when it is there; otherwise a throwaway password is made for this run.
    # A superuser must have a second factor, so jack is enrolled with an authenticator app whose
    # secret the specs type codes from.
    - name: Give jack a password and a second factor for this run
      env:
        C_PASSWORD_SECRET: ${{ secrets.C_PASSWORD }}
      run: |
        C_PASSWORD="${C_PASSWORD_SECRET:-$(openssl rand -hex 24)}"
        C_TOTP_SECRET="$(python3 -c 'import base64, secrets; print(base64.b32encode(secrets.token_bytes(20)).decode())')"
        echo "::add-mask::$C_PASSWORD"
        echo "::add-mask::$C_TOTP_SECRET"
        echo "C_PASSWORD=$C_PASSWORD" >> "$GITHUB_ENV"
        echo "C_TOTP_SECRET=$C_TOTP_SECRET" >> "$GITHUB_ENV"
        export C_PASSWORD C_TOTP_SECRET
        docker compose -f local.yml run --rm -e C_PASSWORD -e C_TOTP_SECRET django python manage.py shell -c \
          "import os; from allauth.mfa.totp.internal.auth import TOTP; from attendees.users.models import User; u = User.objects.get(username='jack'); u.set_password(os.environ['C_PASSWORD']); u.save(); TOTP.activate(u, os.environ['C_TOTP_SECRET'])"

    - name: Run Playwright tests
      # Only the specs written against fixtures/ci_seed.json; the golden
      # congregation's specs run in playwright.yml against their own data.
      run: timeout 500 npx playwright test --project=ci-seed --workers=1
      env:
        BASE_URL: http://127.0.0.1:8008
        # C_PASSWORD comes from the step above, through $GITHUB_ENV.

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  # The same specs against Django running directly on SQLite: the second backend the application
  # supports, started without Docker.
  e2e-test-sqlite:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: sqlite:////tmp/attendees-e2e.sqlite3
      CELERY_BROKER_URL: memory://
      CELERY_TASK_ALWAYS_EAGER: "True"
      USE_DOCKER: "no"
      DJANGO_SECRET_KEY: e2e-not-secret
      DJANGO_LOGIN_FAILED_RATE_LIMIT: 1000/m

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install Node dependencies
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: requirements/*.txt

    - name: Install system libraries and Python requirements
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev gdal-bin libpango-1.0-0 libpangoft2-1.0-0
        pip install -r requirements/local.txt

    - name: Build the database and load the seed
      run: |
        python manage.py migrate
        python manage.py update_content_types
        python manage.py loaddata fixtures/ci_seed.json

    - name: Give jack a password and a second factor for this run
      env:
        C_PASSWORD_SECRET: ${{ secrets.C_PASSWORD }}
      run: |
        C_PASSWORD="${C_PASSWORD_SECRET:-$(openssl rand -hex 24)}"
        C_TOTP_SECRET="$(python -c 'import base64, secrets; print(base64.b32encode(secrets.token_bytes(20)).decode())')"
        echo "::add-mask::$C_PASSWORD"
        echo "::add-mask::$C_TOTP_SECRET"
        echo "C_PASSWORD=$C_PASSWORD" >> "$GITHUB_ENV"
        echo "C_TOTP_SECRET=$C_TOTP_SECRET" >> "$GITHUB_ENV"
        export C_PASSWORD C_TOTP_SECRET
        python manage.py shell -c \
          "import os; from allauth.mfa.totp.internal.auth import TOTP; from attendees.users.models import User; u = User.objects.get(username='jack'); u.set_password(os.environ['C_PASSWORD']); u.save(); TOTP.activate(u, os.environ['C_TOTP_SECRET'])"

    - name: Start Django on SQLite
      run: |
        nohup python manage.py runserver 0.0.0.0:8008 --insecure --noreload > django.log 2>&1 &
        for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8008/ && break; sleep 1; done

    - name: Run Playwright tests
      run: timeout 500 npx playwright test --project=ci-seed --workers=1
      env:
        BASE_URL: http://127.0.0.1:8008

    - name: Django log
      if: failure()
      run: tail -n 200 django.log

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-sqlite
        path: playwright-report/
        retention-days: 30
